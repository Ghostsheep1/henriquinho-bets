name: Refresh pregame bookmaker snapshot

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Request protected production snapshot refresh
        run: |
          token_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=henriquinho-bets-snapshot")"
          id_token="$(printf '%s' "$token_response" | jq --exit-status --raw-output '.value')"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $id_token" \
            "https://henriquinhobets.vercel.app/api/cron/odds-snapshot"
